schema_version: 1

context:
  name: noodles
  version: 0.3.4

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/noodles-${{ version }}.tar.gz
  sha256: 6fdd9b0501133d9d013c02eafe9ce934b295553d51fa19368c849fe48b5e9fe7

build:
  number: 3
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - poetry
  run:
    - filelock >=3.4.2,<4.0.0
    - python-graphviz >=0.19.1,<0.20.0
    - h5py >=3.6.0,<4.0.0
    - numpy >=1.22.2,<2.0.0
    - python >=${{ python_min }},<4.0
    - pyxenon >=3.0.3,<4.0.0

tests:
  - python:
      imports:
        - noodles
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Worflow Engine
  license: Apache-2.0
  license_file:
    - LICENSE
  homepage: https://pypi.org/project/noodles/

extra:
  recipe-maintainers:
    - jan-janssen
